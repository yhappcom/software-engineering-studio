name: S005 Offline Attestation Verification

on:
  push:
    paths:
      - '.github/workflows/s005-offline-attestation-verification.yml'
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

jobs:
  verify-offline:
    runs-on: ubuntu-latest
    steps:
      - name: Reconstruct exact attested subject
        shell: bash
        run: |
          set -euo pipefail
          printf 'repository=yhappcom/software-engineering-studio\ncommit=ab6dbf4307078fc82ddc056029f686dd61eae3a7\n' > subject.txt
          test "$(sha256sum subject.txt | awk '{print $1}')" = '9f2ddf6d0d14733ead35f5d1050f4455b19877f501fd19e5220e725ba626b071'

      - name: Export attestation bundle while online
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation download subject.txt -R yhappcom/software-engineering-studio
          bundle="$(find . -maxdepth 1 -type f -name 'sha256:*.jsonl' -print -quit)"
          test -n "$bundle"
          mv "$bundle" bundle.jsonl
          test -s bundle.jsonl

      - name: Export current trusted roots while online
        shell: bash
        run: |
          set -euo pipefail
          gh attestation trusted-root > trusted_root.jsonl
          test -s trusted_root.jsonl

      - name: Verify exact subject in isolated network namespace
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare -n -- bash -c '
            set -euo pipefail
            if curl --connect-timeout 2 -fsS https://api.github.com >/dev/null 2>&1; then
              echo "network isolation oracle failed: outbound network still reachable" >&2
              exit 90
            fi
            gh attestation verify subject.txt \
              -R yhappcom/software-engineering-studio \
              --bundle bundle.jsonl \
              --custom-trusted-root trusted_root.jsonl
          '

      - name: Reject wrong repository identity offline
        shell: bash
        run: |
          set -euo pipefail
          if sudo unshare -n -- gh attestation verify subject.txt \
            -R yhappcom/design-studio \
            --bundle bundle.jsonl \
            --custom-trusted-root trusted_root.jsonl; then
            echo 'wrong repository identity unexpectedly accepted' >&2
            exit 91
          fi

      - name: Reject mutated subject offline
        shell: bash
        run: |
          set -euo pipefail
          cp subject.txt mutated.txt
          printf '%s\n' 'mutation' >> mutated.txt
          if sudo unshare -n -- gh attestation verify mutated.txt \
            -R yhappcom/software-engineering-studio \
            --bundle bundle.jsonl \
            --custom-trusted-root trusted_root.jsonl; then
            echo 'mutated subject unexpectedly accepted' >&2
            exit 92
          fi
