name: S005 Offline Attestation Verification

on:
  push:
    paths:
      - '.github/workflows/s005-offline-attestation-verification.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify-offline:
    runs-on: ubuntu-latest
    steps:
      - name: Create fresh deterministic subject
        shell: bash
        run: |
          set -euo pipefail
          printf 'S005 offline attestation transfer fixture\n' > subject.txt
          sha256sum subject.txt | tee subject.sha256

      - name: Generate fresh build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: subject.txt

      - name: Preserve locally-created attestation path evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/created_attestation_paths.txt"
          cp "$RUNNER_TEMP/created_attestation_paths.txt" created_attestation_paths.txt
          while IFS= read -r p; do
            test -s "$p"
            printf '%s  %s\n' "$(sha256sum "$p" | awk '{print $1}')" "$p"
          done < created_attestation_paths.txt > created_attestation_bundle.sha256

      - name: Download fresh attestation bundle immediately
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version | tee gh-version.txt
          gh auth status >> gh-version.txt 2>&1
          gh attestation download subject.txt -R yhappcom/software-engineering-studio | tee bundle-download.txt
          bundle="$(find . -maxdepth 1 -type f -name 'sha256:*.jsonl' -print -quit)"
          test -n "$bundle"
          test -s "$bundle"
          mv "$bundle" bundle.jsonl
          sha256sum bundle.jsonl > bundle.sha256

      - name: Export current trusted roots while online
        shell: bash
        run: |
          set -euo pipefail
          gh attestation trusted-root > trusted_root.jsonl
          test -s trusted_root.jsonl
          sha256sum trusted_root.jsonl > trusted_root.sha256

      - name: Verify exact subject in isolated network namespace
        id: offline_positive
        continue-on-error: true
        shell: bash
        run: |
          set +e
          sudo unshare -n -- bash -c '
            set -o pipefail
            if curl --connect-timeout 2 -fsS https://api.github.com >/dev/null 2>&1; then
              echo "network isolation oracle failed: outbound network still reachable" >&2
              exit 90
            fi
            echo "NETWORK_ISOLATION_CONFIRMED"
            gh attestation verify subject.txt \
              -R yhappcom/software-engineering-studio \
              --bundle bundle.jsonl \
              --custom-trusted-root trusted_root.jsonl
          ' > offline-positive.txt 2> offline-positive.stderr.txt
          rc=$?
          printf '%s\n' "$rc" > offline-positive.rc
          exit "$rc"

      - name: Reject wrong repository identity offline
        if: steps.offline_positive.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          sudo unshare -n -- gh attestation verify subject.txt \
            -R yhappcom/design-studio \
            --bundle bundle.jsonl \
            --custom-trusted-root trusted_root.jsonl \
            > wrong-repo.txt 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > wrong-repo.rc
          test "$rc" -ne 0

      - name: Reject mutated subject offline
        if: steps.offline_positive.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp subject.txt mutated.txt
          printf '%s\n' 'mutation' >> mutated.txt
          set +e
          sudo unshare -n -- gh attestation verify mutated.txt \
            -R yhappcom/software-engineering-studio \
            --bundle bundle.jsonl \
            --custom-trusted-root trusted_root.jsonl \
            > mutated.txt.verify 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > mutated.rc
          test "$rc" -ne 0

      - name: Preserve S005 semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s005-offline-attestation-evidence
          path: |
            subject.txt
            subject.sha256
            created_attestation_paths.txt
            created_attestation_bundle.sha256
            gh-version.txt
            bundle-download.txt
            bundle.jsonl
            bundle.sha256
            trusted_root.jsonl
            trusted_root.sha256
            offline-positive.txt
            offline-positive.stderr.txt
            offline-positive.rc
            wrong-repo.txt
            wrong-repo.rc
            mutated.txt
            mutated.txt.verify
            mutated.rc
          if-no-files-found: warn

      - name: Fail closed on positive offline verification
        if: steps.offline_positive.outcome != 'success'
        shell: bash
        run: |
          cat offline-positive.stderr.txt >&2 || true
          exit 98
