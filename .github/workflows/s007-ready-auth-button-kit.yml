name: S007 Ready Auth Button Kit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/s007-ready-auth-button-kit.yml'
      - 'research/systems/fixtures/S007_auth_provider_buttons/ready_to_use/**'
      - 'research/systems/fixtures/S007_auth_provider_buttons/assets/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain
        run: |
          flutter --version
          dart --version

      - name: Prepare exact provider assets
        run: bash research/systems/fixtures/S007_auth_provider_buttons/ready_to_use/tools/prepare_ready_to_use_assets.sh

      - name: Analyze package
        working-directory: research/systems/fixtures/S007_auth_provider_buttons/ready_to_use
        run: |
          flutter pub get
          flutter analyze

      - name: Test package
        working-directory: research/systems/fixtures/S007_auth_provider_buttons/ready_to_use
        run: flutter test --reporter expanded

      - name: Commit exact provider assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/systems/fixtures/S007_auth_provider_buttons/ready_to_use/assets
          if git diff --cached --quiet; then
            echo "No ready-to-use provider asset changes."
            exit 0
          fi
          git commit -m "S007 materialize ready-to-use auth button assets"
          git push origin HEAD:${GITHUB_REF_NAME}
