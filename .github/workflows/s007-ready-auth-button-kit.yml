name: S007 Ready Auth Button Kit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/s007-ready-auth-button-kit.yml'
      - 'research/systems/fixtures/S007_auth_provider_buttons/ready_to_use/lib/**'
      - 'research/systems/fixtures/S007_auth_provider_buttons/ready_to_use/ios/**'
      - 'research/systems/fixtures/S007_auth_provider_buttons/ready_to_use/tools/**'
      - 'research/systems/fixtures/S007_auth_provider_buttons/ready_to_use/test/*.dart'
      - 'research/systems/fixtures/S007_auth_provider_buttons/ready_to_use/pubspec.yaml'
      - 'research/systems/fixtures/S007_auth_provider_buttons/assets/**'

concurrency:
  group: s007-ready-auth-button-kit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain
        run: |
          flutter --version
          dart --version

      - name: Prepare exact provider assets
        run: bash research/systems/fixtures/S007_auth_provider_buttons/ready_to_use/tools/prepare_ready_to_use_assets.sh

      - name: Analyze package
        working-directory: research/systems/fixtures/S007_auth_provider_buttons/ready_to_use
        run: |
          flutter pub get
          flutter analyze

      - name: Test and render package
        working-directory: research/systems/fixtures/S007_auth_provider_buttons/ready_to_use
        run: flutter test --update-goldens --reporter expanded

      - name: Commit generated assets and renders
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/systems/fixtures/S007_auth_provider_buttons/ready_to_use/assets
          git add research/systems/fixtures/S007_auth_provider_buttons/ready_to_use/test/goldens
          if git diff --cached --quiet; then
            echo "No generated auth-button changes."
            exit 0
          fi
          git commit -m "S007 materialize ready-to-use auth buttons and renders"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
