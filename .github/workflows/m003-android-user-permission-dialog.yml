name: M003 Android user permission dialog transfer

on:
  push:
    paths:
      - '.github/workflows/m003-android-user-permission-dialog.yml'
  workflow_dispatch:

jobs:
  user-permission-dialog:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Record toolchain identity
        shell: bash
        run: |
          set -euxo pipefail
          flutter --version --machine | tee flutter-version.json
          git -C "$RUNNER_TEMP/flutter" rev-parse HEAD | tee flutter-git-head.txt
          dart --version 2>&1 | tee dart-version.txt
      - name: Create isolated dialog fixture
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          flutter create --platforms android --org dev.yhapp.studio m003_user_permission
          cd m003_user_permission
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.CAMERA" />')
          p.write_text(s)
          PY
          cat > android/app/src/main/kotlin/dev/yhapp/studio/m003_user_permission/MainActivity.kt <<'KOTLIN'
          package dev.yhapp.studio.m003_user_permission
          import android.Manifest
          import android.content.pm.PackageManager
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity: FlutterActivity() {
            private var pending: MethodChannel.Result? = null
            override fun configureFlutterEngine(engine: FlutterEngine) {
              super.configureFlutterEngine(engine)
              MethodChannel(engine.dartExecutor.binaryMessenger,"studio.m003/user_permission").setMethodCallHandler { call,result ->
                when(call.method) {
                  "status" -> result.success(status())
                  "request" -> { pending=result; ActivityCompat.requestPermissions(this,arrayOf(Manifest.permission.CAMERA),77) }
                  else -> result.notImplemented()
                }
              }
            }
            private fun status() = if(ContextCompat.checkSelfPermission(this,Manifest.permission.CAMERA)==PackageManager.PERMISSION_GRANTED) "GRANTED" else "DENIED"
            override fun onRequestPermissionsResult(requestCode:Int, permissions:Array<out String>, grantResults:IntArray) {
              super.onRequestPermissionsResult(requestCode,permissions,grantResults)
              if(requestCode==77){ pending?.success(status()); pending=null }
            }
          }
          KOTLIN
          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          void main()=>runApp(const App());
          class App extends StatefulWidget { const App({super.key}); State<App> createState()=>_S(); }
          class _S extends State<App>{
            static const c=MethodChannel('studio.m003/user_permission'); String state='LOADING';
            void initState(){super.initState(); _read();}
            Future<void> _read() async { final s=await c.invokeMethod<String>('status')??'UNKNOWN'; if(mounted)setState(()=>state=s); }
            Future<void> _request() async { final s=await c.invokeMethod<String>('request')??'UNKNOWN'; if(mounted)setState(()=>state=s); }
            Widget build(BuildContext context)=>MaterialApp(home:Scaffold(body:Center(child:Column(mainAxisSize:MainAxisSize.min,children:[Text('CAMERA:$state'),ElevatedButton(onPressed:_request,child:const Text('REQUEST CAMERA'))]))));
          }
          DART
          flutter build apk --debug
      - name: Create phase-reporting user-choice oracle
        shell: bash
        run: |
          set -euxo pipefail
          cat > "$RUNNER_TEMP/m003_user_oracle.py" <<'PY'
          import os,re,subprocess,time,traceback,xml.etree.ElementTree as ET
          PKG='dev.yhapp.studio.m003_user_permission'; APK=f'{os.environ["RUNNER_TEMP"]}/m003_user_permission/build/app/outputs/flutter-apk/app-debug.apk'
          VERDICT=os.path.join(os.environ['GITHUB_WORKSPACE'],'m003-user-permission-phase.txt'); phase='setup'
          def mark(value):
            global phase; phase=value
            with open(VERDICT,'w') as f: f.write(value+'\n')
            print('M003_PHASE='+value,flush=True)
          def sh(*a): return subprocess.check_output(['adb',*a],text=True).strip()
          def dump(name):
            subprocess.run(['adb','shell','uiautomator','dump',f'/sdcard/{name}.xml'],check=True,stdout=subprocess.DEVNULL)
            subprocess.run(['adb','pull',f'/sdcard/{name}.xml',f'/tmp/{name}.xml'],check=True,stdout=subprocess.DEVNULL)
            return ET.parse(f'/tmp/{name}.xml')
          def tap_node(n,identity):
            m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib['bounds']); assert m,(identity,n.attrib)
            x1,y1,x2,y2=map(int,m.groups()); subprocess.run(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)],check=True)
          def tap_label(label,name):
            tree=dump(name)
            for n in tree.iter('node'):
              channel='text' if n.attrib.get('text')==label else ('content-desc' if n.attrib.get('content-desc')==label else None)
              if channel:
                print(f'M003_SELECTOR label={label!r} channel={channel}',flush=True); tap_node(n,label); return
            raise AssertionError(f'{label!r} not found in text/content-desc: '+ET.tostring(tree.getroot(),encoding='unicode'))
          def find_resource(suffix,name):
            tree=dump(name)
            for n in tree.iter('node'):
              rid=n.attrib.get('resource-id','')
              if rid.endswith('/'+suffix) or rid.endswith(':id/'+suffix):
                print(f'M003_SYSTEM_CONTROL resource_id={rid}',flush=True); return n
            raise AssertionError(f'resource id suffix {suffix!r} not found: '+ET.tostring(tree.getroot(),encoding='unicode'))
          def resource_present(suffix,name):
            tree=dump(name)
            return any((n.attrib.get('resource-id','').endswith('/'+suffix) or n.attrib.get('resource-id','').endswith(':id/'+suffix)) for n in tree.iter('node'))
          def tap_resource(suffix,name): tap_node(find_resource(suffix,name),suffix)
          def require_ui(text,name):
            time.sleep(1); xml=ET.tostring(dump(name).getroot(),encoding='unicode'); assert text in xml,(text,xml)
          try:
            mark('install_initial'); subprocess.run(['adb','install','-r',APK],check=True)
            mark('launch_initial'); sh('shell','am','start','-W','-n',PKG+'/.MainActivity')
            mark('observe_initial_denied'); require_ui('CAMERA:DENIED','initial')
            mark('tap_request_one_time'); tap_label('REQUEST CAMERA','request_button'); time.sleep(1)
            mark('discover_one_time_choice'); find_resource('permission_allow_one_time_button','permission_dialog')
            mark('select_one_time_choice'); tap_resource('permission_allow_one_time_button','permission_dialog_tap')
            mark('observe_granted_callback'); require_ui('CAMERA:GRANTED','one_time_granted')
            mark('verify_granted_package_state'); pkg=sh('shell','dumpsys','package',PKG); assert 'android.permission.CAMERA: granted=true' in pkg,pkg
            mark('reset_install'); subprocess.run(['adb','uninstall',PKG],check=True); subprocess.run(['adb','install',APK],check=True)
            mark('launch_fresh_denial_case'); sh('shell','am','start','-W','-n',PKG+'/.MainActivity')
            mark('observe_fresh_denied'); require_ui('CAMERA:DENIED','fresh_install')
            mark('tap_request_denial_first'); tap_label('REQUEST CAMERA','deny_request_1'); time.sleep(1)
            mark('select_dont_allow_first'); tap_resource('permission_deny_button','deny_dialog_1')
            mark('observe_denied_callback_first'); require_ui('CAMERA:DENIED','user_denied_1')
            mark('verify_first_denial_flags'); pkg=sh('shell','dumpsys','package',PKG); assert 'android.permission.CAMERA: granted=false' in pkg,pkg; assert 'USER_SET' in pkg,pkg
            mark('tap_request_denial_second'); tap_label('REQUEST CAMERA','deny_request_2'); time.sleep(1)
            mark('discover_second_denial_dialog'); find_resource('permission_deny_and_dont_ask_again_button','deny_dialog_2_discovery')
            mark('select_dont_allow_second'); tap_resource('permission_deny_and_dont_ask_again_button','deny_dialog_2')
            mark('observe_denied_callback_second'); require_ui('CAMERA:DENIED','user_denied_2')
            mark('verify_user_fixed'); pkg=sh('shell','dumpsys','package',PKG); assert 'android.permission.CAMERA: granted=false' in pkg,pkg; assert 'USER_FIXED' in pkg,pkg
            mark('tap_request_after_user_fixed'); tap_label('REQUEST CAMERA','deny_request_3'); time.sleep(1)
            mark('verify_no_third_permission_dialog'); assert not resource_present('permission_deny_button','after_user_fixed') and not resource_present('permission_deny_and_dont_ask_again_button','after_user_fixed_2'), 'permission dialog unexpectedly visible after USER_FIXED'
            mark('observe_denied_callback_after_user_fixed'); require_ui('CAMERA:DENIED','user_fixed_denied')
            mark('complete'); print('M003_REPEATED_DENIAL_USER_FIXED_PASS')
          except Exception:
            failed=phase
            with open(VERDICT,'w') as f: f.write('FAILED:'+failed+'\n')
            print('M003_FAILED_PHASE='+failed,flush=True); traceback.print_exc(); raise
          PY
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute phase-reporting user-driven permission oracle
        id: emulator_oracle
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 "$RUNNER_TEMP/m003_user_oracle.py"
      - name: Report semantic phase
        if: always()
        shell: bash
        run: |
          if [[ -f m003-user-permission-phase.txt ]]; then cat m003-user-permission-phase.txt; else echo 'NO_PHASE_FILE'; fi
      - name: Fail — no recoverable phase evidence
        if: always()
        shell: bash
        run: "[[ -f m003-user-permission-phase.txt ]] || { echo 'M003_NO_PHASE_EVIDENCE'; exit 1; }"
      - name: Fail — baseline one-time path
        if: always()
        shell: bash
        run: "! grep -Eq '^FAILED:(install_initial|launch_initial|observe_initial_denied|tap_request_one_time|discover_one_time_choice|select_one_time_choice|observe_granted_callback|verify_granted_package_state|reset_install|launch_fresh_denial_case|observe_fresh_denied)$' m003-user-permission-phase.txt || { echo 'M003_FAIL_BASELINE_ONE_TIME_PATH'; exit 1; }"
      - name: Fail — first denial
        if: always()
        shell: bash
        run: "! grep -Eq '^FAILED:(tap_request_denial_first|select_dont_allow_first|observe_denied_callback_first|verify_first_denial_flags)$' m003-user-permission-phase.txt || { echo 'M003_FAIL_FIRST_DENIAL'; exit 1; }"
      - name: Fail — second denial request tap
        if: always()
        shell: bash
        run: "! grep -qx 'FAILED:tap_request_denial_second' m003-user-permission-phase.txt || { echo 'M003_FAIL_SECOND_DENIAL_REQUEST_TAP'; exit 1; }"
      - name: Fail — second denial dialog discovery
        if: always()
        shell: bash
        run: "! grep -qx 'FAILED:discover_second_denial_dialog' m003-user-permission-phase.txt || { echo 'M003_FAIL_SECOND_DENIAL_DIALOG_DISCOVERY'; exit 1; }"
      - name: Fail — second denial system interaction
        if: always()
        shell: bash
        run: "! grep -qx 'FAILED:select_dont_allow_second' m003-user-permission-phase.txt || { echo 'M003_FAIL_SECOND_DENIAL_SYSTEM_INTERACTION'; exit 1; }"
      - name: Fail — second denial callback UI
        if: always()
        shell: bash
        run: "! grep -qx 'FAILED:observe_denied_callback_second' m003-user-permission-phase.txt || { echo 'M003_FAIL_SECOND_DENIAL_CALLBACK'; exit 1; }"
      - name: Fail — USER_FIXED diagnostic state
        if: always()
        shell: bash
        run: "! grep -qx 'FAILED:verify_user_fixed' m003-user-permission-phase.txt || { echo 'M003_FAIL_USER_FIXED_DIAGNOSTIC'; exit 1; }"
      - name: Fail — post USER_FIXED request suppression
        if: always()
        shell: bash
        run: "! grep -Eq '^FAILED:(tap_request_after_user_fixed|verify_no_third_permission_dialog|observe_denied_callback_after_user_fixed)$' m003-user-permission-phase.txt || { echo 'M003_FAIL_POST_USER_FIXED_SUPPRESSION'; exit 1; }"
      - name: Require complete repeated-denial oracle
        if: always()
        shell: bash
        run: |
          grep -qx 'complete' m003-user-permission-phase.txt
          [[ '${{ steps.emulator_oracle.outcome }}' == 'success' ]]
          echo 'M003 bounded repeated-denial USER_FIXED oracle passed'
