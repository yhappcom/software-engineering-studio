name: S005 Attestation Authorization Policy

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/s005-attestation-authorization-policy.yml'

permissions:
  contents: read
  attestations: read

jobs:
  verify-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Reconstruct attested subject
        shell: bash
        run: |
          set -euo pipefail
          printf 'repository=yhappcom/software-engineering-studio\ncommit=ab6dbf4307078fc82ddc056029f686dd61eae3a7\n' > subject.txt
          test "$(sha256sum subject.txt | cut -d' ' -f1)" = '9f2ddf6d0d14733ead35f5d1050f4455b19877f501fd19e5220e725ba626b071'

      - name: Verify exact authorization policy
        id: exact
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify subject.txt \
            --repo yhappcom/software-engineering-studio \
            --signer-workflow yhappcom/software-engineering-studio/.github/workflows/s005-attestation-boundary.yml \
            --source-ref refs/heads/main \
            --source-digest ab6dbf4307078fc82ddc056029f686dd61eae3a7

      - name: Reject wrong signer workflow
        id: wrongworkflow
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh attestation verify subject.txt \
            --repo yhappcom/software-engineering-studio \
            --signer-workflow yhappcom/software-engineering-studio/.github/workflows/not-the-signer.yml; then
            exit 1
          fi

      - name: Reject wrong source ref
        id: wrongref
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh attestation verify subject.txt \
            --repo yhappcom/software-engineering-studio \
            --source-ref refs/heads/not-main; then
            exit 1
          fi

      - name: Reject wrong source digest
        id: wrongdigest
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh attestation verify subject.txt \
            --repo yhappcom/software-engineering-studio \
            --source-digest 0000000000000000000000000000000000000000; then
            exit 1
          fi

      - name: Classify policy boundary
        env:
          EXACT: ${{ steps.exact.outcome }}
          WRONG_WORKFLOW_REJECTION: ${{ steps.wrongworkflow.outcome }}
          WRONG_REF_REJECTION: ${{ steps.wrongref.outcome }}
          WRONG_DIGEST_REJECTION: ${{ steps.wrongdigest.outcome }}
        run: |
          printf 'exact=%s\nwrong_workflow_rejection=%s\nwrong_ref_rejection=%s\nwrong_digest_rejection=%s\n' \
            "$EXACT" "$WRONG_WORKFLOW_REJECTION" "$WRONG_REF_REJECTION" "$WRONG_DIGEST_REJECTION"
          test "$EXACT" = success
          test "$WRONG_WORKFLOW_REJECTION" = success
          test "$WRONG_REF_REJECTION" = success
          test "$WRONG_DIGEST_REJECTION" = success
