name: M006 Browser Service Worker Validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/mobile/fixtures/m006_browser_service_worker/**'
      - '.github/workflows/m006-browser-service-worker-validation.yml'
concurrency:
  group: m006-browser-service-worker-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Record environment
        run: |
          node --version
          python3 --version
          uname -a
      - name: Install pinned Playwright Chromium
        working-directory: research/mobile/fixtures/m006_browser_service_worker
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute browser service-worker offline oracle
        timeout-minutes: 2
        working-directory: research/mobile/fixtures/m006_browser_service_worker
        run: node validate.mjs
      - name: Execute browser restart persistence oracle
        timeout-minutes: 2
        working-directory: research/mobile/fixtures/m006_browser_service_worker
        run: node validate_restart.mjs
      - name: Execute service-worker update transition oracle
        timeout-minutes: 2
        working-directory: research/mobile/fixtures/m006_browser_service_worker
        run: node validate_update.mjs
      - name: Execute offline cold-start navigation oracle
        timeout-minutes: 2
        working-directory: research/mobile/fixtures/m006_browser_service_worker
        run: |
          python3 -m http.server 8768 --bind 127.0.0.1 >/tmp/m006-cold-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          node validate_cold_start.mjs
