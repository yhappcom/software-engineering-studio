name: S007 Auth Button Render

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/s007-auth-button-render.yml'
      - 'research/systems/fixtures/S007_auth_provider_buttons/render_harness/**'
      - 'research/systems/fixtures/S007_auth_provider_buttons/assets/**'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Record toolchain
        run: |
          flutter --version
          dart --version

      - name: Prepare official provider assets
        run: bash research/systems/fixtures/S007_auth_provider_buttons/render_harness/tools/prepare_render_assets.sh

      - name: Analyze
        working-directory: research/systems/fixtures/S007_auth_provider_buttons/render_harness
        run: |
          flutter pub get
          flutter analyze

      - name: Render and test
        working-directory: research/systems/fixtures/S007_auth_provider_buttons/render_harness
        run: flutter test --update-goldens --reporter expanded

      - name: Commit rendered evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/systems/fixtures/S007_auth_provider_buttons/render_harness/test/goldens
          if git diff --cached --quiet; then
            echo "No golden changes."
            exit 0
          fi
          git commit -m "S007 render auth provider button previews"
          git push origin HEAD:${GITHUB_REF_NAME}
