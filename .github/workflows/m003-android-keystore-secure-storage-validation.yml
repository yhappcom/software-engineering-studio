name: M003 Android Keystore secure storage validation

on:
  push:
    paths:
      - '.github/workflows/m003-android-keystore-secure-storage-validation.yml'
  workflow_dispatch:

jobs:
  android-keystore-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Record toolchain identity
        shell: bash
        run: |
          set -euxo pipefail
          flutter --version --machine | tee flutter-version.json
          git -C "$RUNNER_TEMP/flutter" rev-parse HEAD | tee flutter-git-head.txt
          dart --version 2>&1 | tee dart-version.txt
      - name: Create isolated Keystore fixture
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          flutter create --platforms android --org dev.yhapp.studio m003_keystore_fixture
          cd m003_keystore_fixture
          cat > android/app/src/main/kotlin/dev/yhapp/studio/m003_keystore_fixture/MainActivity.kt <<'KOTLIN'
          package dev.yhapp.studio.m003_keystore_fixture
          import android.os.Bundle
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import android.util.Base64
          import android.util.Log
          import android.widget.TextView
          import io.flutter.embedding.android.FlutterActivity
          import java.io.File
          import java.security.KeyStore
          import javax.crypto.AEADBadTagException
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec

          class MainActivity : FlutterActivity() {
              private val alias = "studio-m003-aes"
              private val marker = "secure-v1"
              private val file by lazy { File(filesDir, "ciphertext.txt") }
              override fun onCreate(savedInstanceState: Bundle?) {
                  Log.i("M003Boundary", "ACTIVITY_ONCREATE_ENTER")
                  super.onCreate(savedInstanceState)
                  Log.i("M003Boundary", "FLUTTER_SUPER_ONCREATE_RETURNED")
                  val result = try { runBoundary() } catch (e: AEADBadTagException) { "AUTH_FAIL" } catch (e: Exception) { "ERROR:${e.javaClass.simpleName}" }
                  Log.i("M003Boundary", "NATIVE_RESULT:$result")
                  setContentView(TextView(this).apply { text = result; textSize = 20f })
                  Log.i("M003Boundary", "UI_PUBLISHED:$result")
              }
              override fun onResume() {
                  super.onResume()
                  Log.i("M003Boundary", "ACTIVITY_ONRESUME")
              }
              private fun keyStore(): KeyStore = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }
              private fun getOrCreateKey(): SecretKey {
                  val ks = keyStore()
                  (ks.getKey(alias, null) as? SecretKey)?.let { return it }
                  val generator = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore")
                  generator.init(KeyGenParameterSpec.Builder(alias, KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)
                      .setBlockModes(KeyProperties.BLOCK_MODE_GCM).setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE).setKeySize(256).build())
                  return generator.generateKey()
              }
              private fun runBoundary(): String {
                  val key = getOrCreateKey()
                  val exportability = if (key.encoded == null) "NONEXPORTABLE" else "EXPORTABLE"
                  if (!file.exists()) {
                      val cipher = Cipher.getInstance("AES/GCM/NoPadding")
                      cipher.init(Cipher.ENCRYPT_MODE, key)
                      val encrypted = cipher.doFinal(marker.toByteArray(Charsets.UTF_8))
                      file.writeText(Base64.encodeToString(cipher.iv, Base64.NO_WRAP) + "\n" + Base64.encodeToString(encrypted, Base64.NO_WRAP))
                      return "WROTE:$marker:$exportability"
                  }
                  val parts = file.readLines(); require(parts.size == 2)
                  val cipher = Cipher.getInstance("AES/GCM/NoPadding")
                  cipher.init(Cipher.DECRYPT_MODE, key, GCMParameterSpec(128, Base64.decode(parts[0], Base64.NO_WRAP)))
                  val plain = cipher.doFinal(Base64.decode(parts[1], Base64.NO_WRAP)).toString(Charsets.UTF_8)
                  return "RECOVERED:$plain:$exportability"
              }
          }
          KOTLIN
          flutter build apk --debug
      - name: Create independently instrumented Android oracle
        shell: bash
        run: |
          set -euxo pipefail
          cat > "$RUNNER_TEMP/m003_keystore_oracle.sh" <<'BASH'
          #!/usr/bin/env bash
          set -uo pipefail
          PKG=dev.yhapp.studio.m003_keystore_fixture
          APK="$RUNNER_TEMP/m003_keystore_fixture/build/app/outputs/flutter-apk/app-debug.apk"
          PHASE=emulator_ready
          finish() { rc=$?; echo "phase=$PHASE" >> "$GITHUB_OUTPUT"; echo "oracle_rc=$rc" >> "$GITHUB_OUTPUT"; adb logcat -d -s M003Boundary:I '*:S' || true; exit 0; }
          trap finish EXIT
          set -e
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.product.cpu.abi
          PHASE=install
          adb install -r "$APK"
          adb logcat -c
          PHASE=first_launch_start
          adb shell am start -W -n "$PKG/.MainActivity"
          PHASE=first_launch_pid
          for i in $(seq 1 20); do PID1=$(adb shell pidof "$PKG" | tr -d '\r'); test -n "$PID1" && break; sleep 0.5; done
          test -n "${PID1:-}"
          PHASE=first_launch_activity
          for i in $(seq 1 20); do adb logcat -d -s M003Boundary:I '*:S' | grep -q 'ACTIVITY_ONCREATE_ENTER' && break; sleep 0.5; done
          adb logcat -d -s M003Boundary:I '*:S' | grep 'ACTIVITY_ONCREATE_ENTER'
          PHASE=first_launch_native
          for i in $(seq 1 40); do adb logcat -d -s M003Boundary:I '*:S' | grep -q 'NATIVE_RESULT:WROTE:secure-v1:NONEXPORTABLE' && break; sleep 0.5; done
          adb logcat -d -s M003Boundary:I '*:S' | grep 'NATIVE_RESULT:WROTE:secure-v1:NONEXPORTABLE'
          PHASE=first_launch_ui_publish
          adb logcat -d -s M003Boundary:I '*:S' | grep 'UI_PUBLISHED:WROTE:secure-v1:NONEXPORTABLE'
          PHASE=first_launch_resume
          adb logcat -d -s M003Boundary:I '*:S' | grep 'ACTIVITY_ONRESUME'
          PHASE=first_launch_ui_observe
          for i in $(seq 1 20); do adb shell uiautomator dump /sdcard/m003-key-write.xml >/dev/null 2>&1 || true; adb shell cat /sdcard/m003-key-write.xml 2>/dev/null | grep -q 'WROTE:secure-v1:NONEXPORTABLE' && break; sleep 0.5; done
          adb shell cat /sdcard/m003-key-write.xml | grep 'WROTE:secure-v1:NONEXPORTABLE'
          PHASE=force_stop
          adb shell am force-stop "$PKG"; test -z "$(adb shell pidof "$PKG" | tr -d '\r')"
          PHASE=recovery
          adb shell am start -W -n "$PKG/.MainActivity"; sleep 3
          adb shell uiautomator dump /sdcard/m003-key-recover.xml >/dev/null
          adb shell cat /sdcard/m003-key-recover.xml | grep 'RECOVERED:secure-v1:NONEXPORTABLE'
          PID2=$(adb shell pidof "$PKG" | tr -d '\r'); test -n "$PID2"; test "$PID1" != "$PID2"
          PHASE=tamper_read
          adb shell am force-stop "$PKG"
          TMP=$(mktemp)
          adb shell run-as "$PKG" cat files/ciphertext.txt > "$TMP"
          PHASE=tamper_mutate
          python3 - "$TMP" <<'PY'
          import sys
          p=sys.argv[1]; lines=open(p).read().splitlines(); assert len(lines)==2 and len(lines[1])>2
          lines[1]=('A' if lines[1][0] != 'A' else 'B')+lines[1][1:]
          open(p,'w').write('\n'.join(lines)+'\n')
          PY
          PHASE=tamper_write
          adb shell "run-as $PKG sh -c 'cat > files/ciphertext.txt'" < "$TMP"
          PHASE=auth_reject
          adb shell am start -W -n "$PKG/.MainActivity"; sleep 3
          adb shell uiautomator dump /sdcard/m003-key-tamper.xml >/dev/null
          adb shell cat /sdcard/m003-key-tamper.xml | grep 'AUTH_FAIL'
          PHASE=complete
          BASH
          chmod +x "$RUNNER_TEMP/m003_keystore_oracle.sh"
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute Keystore persistence and tamper oracle
        id: oracle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash "$RUNNER_TEMP/m003_keystore_oracle.sh"
      - name: Require complete oracle
        if: steps.oracle.outputs.phase != 'complete' || steps.oracle.outputs.oracle_rc != '0'
        run: |
          echo "M003 failure phase: ${{ steps.oracle.outputs.phase }}"
          echo "M003 oracle rc: ${{ steps.oracle.outputs.oracle_rc }}"
          exit 1
      - name: M003 bounded Keystore oracle passed
        if: steps.oracle.outputs.phase == 'complete' && steps.oracle.outputs.oracle_rc == '0'
        run: echo M003_ANDROID_KEYSTORE_STORAGE_PASS
