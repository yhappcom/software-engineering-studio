name: Q006 third-party action nonzero propagation

on:
  push:
    paths:
      - '.github/workflows/q006-third-party-action-nonzero-propagation.yml'
  workflow_dispatch:

jobs:
  delegated-nonzero-propagation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delegate intentional nonzero script through Android emulator action
        id: delegated
        continue-on-error: true
        # Provenance snapshot 2026-09-24: upstream annotated tag v2 -> tag object
        # 4c44018e59b437e86cdfc41da381398f93ed8808 -> commit below.
        # Pin the executable control so future reruns do not silently change action code.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            printf '%s\n' 'Q006_INTENTIONAL_DELEGATED_FAILURE_REACHED' > /tmp/q006-delegated-reachability.txt
            echo 'Q006_INTENTIONAL_DELEGATED_FAILURE'
            exit 37

      - name: Persist delegated-script reachability marker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q006-delegated-reachability
          path: /tmp/q006-delegated-reachability.txt
          if-no-files-found: error
          retention-days: 7

      - name: Require wrapper to expose delegated failure
        shell: bash
        env:
          DELEGATED_OUTCOME: ${{ steps.delegated.outcome }}
          DELEGATED_CONCLUSION: ${{ steps.delegated.conclusion }}
        run: |
          set -euo pipefail
          printf 'outcome=%s\nconclusion=%s\n' "$DELEGATED_OUTCOME" "$DELEGATED_CONCLUSION"
          test "$DELEGATED_OUTCOME" = failure
          test "$DELEGATED_CONCLUSION" = success
          echo 'Q006_THIRD_PARTY_ACTION_NONZERO_PROPAGATION_PASS'
