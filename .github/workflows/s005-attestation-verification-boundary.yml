name: S005 Attestation Verification Boundary

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/s005-attestation-verification-boundary.yml'

permissions:
  contents: read
  attestations: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Reconstruct attested subject
        shell: bash
        run: |
          set -euo pipefail
          printf 'repository=yhappcom/software-engineering-studio\ncommit=ab6dbf4307078fc82ddc056029f686dd61eae3a7\n' > subject.txt
          echo 'Expected digest: 9f2ddf6d0d14733ead35f5d1050f4455b19877f501fd19e5220e725ba626b071'
          sha256sum subject.txt

      - name: Verify exact repository identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify subject.txt --repo yhappcom/software-engineering-studio

      - name: Reject wrong repository identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh attestation verify subject.txt --repo yhappcom/design-studio; then
            echo 'ERROR: wrong repository identity unexpectedly verified' >&2
            exit 1
          fi
          echo 'wrong repository identity rejected as expected'

      - name: Reject wrong subject bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp subject.txt wrong-subject.txt
          printf 'mutation=1\n' >> wrong-subject.txt
          if gh attestation verify wrong-subject.txt --repo yhappcom/software-engineering-studio; then
            echo 'ERROR: wrong subject unexpectedly verified' >&2
            exit 1
          fi
          echo 'wrong subject rejected as expected'
