name: F002 Dart memory and lifetime validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/foundations/fixtures/F002_dart_identity_lifetime.dart'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.3'
      - name: Record environment
        run: |
          dart --version
          uname -a
          git rev-parse HEAD
      - name: Execute F002 direct Dart fixture
        timeout-minutes: 1
        run: dart run research/foundations/fixtures/F002_dart_identity_lifetime.dart
