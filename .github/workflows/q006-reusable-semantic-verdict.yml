name: Q006 Reusable Semantic Verdict Producer

on:
  workflow_call:
    outputs:
      semantic_verdict:
        description: Semantic acceptance verdict exported by the reusable workflow
        value: ${{ jobs.producer.outputs.semantic_verdict }}

jobs:
  producer:
    runs-on: ubuntu-latest
    outputs:
      semantic_verdict: ${{ steps.emit.outputs.semantic_verdict }}
    steps:
      - name: Emit semantic failure while transport succeeds
        id: emit
        shell: bash
        run: |
          set -euo pipefail
          echo "semantic_verdict=FAIL" >> "$GITHUB_OUTPUT"
          echo "Q006_REUSABLE_SEMANTIC_FAIL_EMITTED"
